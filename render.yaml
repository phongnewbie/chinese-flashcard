# Render Blueprint — Flashcard app
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chinese-flashcard
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: flashcard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Neon PostgreSQL — điền connection string trên Render Dashboard
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
